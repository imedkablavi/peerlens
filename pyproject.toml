[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peerlens"
version = "0.1.0"
description = "CLI framework for authorized chat-call metadata research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PeerLens contributors"}]
keywords = ["osint", "digital-forensics", "reverse-engineering", "voip", "frida"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
frida = ["frida>=16.0"]

[project.scripts]
peerlens = "peerlens.cli:main"

[project.urls]
Repository = "https://github.com/imedkablavi/peerlens"
Issues = "https://github.com/imedkablavi/peerlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
